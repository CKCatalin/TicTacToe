<!-- Based on a tutorial from GeeksforGeeks: -->
<!-- https://www.geeksforgeeks.org/javascript/simple-tic-tac-toe-game-using-javascript/ -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            text-align: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main {
            background-color: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            max-width: 90vw;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game {
            height: 50vmin;
            width: 50vmin;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5vmin;
            justify-content: center;
        }

        .box {
            height: 15vmin;
            width: 15vmin;
            border-radius: 12px;
            border: none;
            background-color: #f3f4f6; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            font-size: 8vmin;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .box:hover {
            background-color: #e5e7eb;
            transform: translateY(-2px);
        }

        #reset, #new-btn {
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #reset:hover, #new-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
        }

        #reset:active, #new-btn:active {
            transform: translateY(0);
        }

        .msg-container {
            margin-bottom: 20px;
        }
        
        #msg {
            font-size: 2rem;
            color: #764ba2;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .hide {
            display: none;
        }
    </style>
</head>
<body>
    
    <main>
        <h1>Tic Tac Toe</h1>
        
        <div class="msg-container hide">
            <p id="msg">Winner</p>
            <button id="new-btn">New Game</button>
        </div>

        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        
        <button id="reset">Reset Game</button>
    </main>

    <script src="main.js"></script>
</body>
</html>
